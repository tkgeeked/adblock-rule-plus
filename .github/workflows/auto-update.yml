name: Auto Update AdBlock Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"  # 每天北京时间 06:00 自动更新
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "adblockplus.conf"

